<title>Band Tune Book</title>

<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Tune Book">
<style>
@font-face { font-family: 'Libre Franklin'; font-weight: 400; font-display: swap; src: url('fonts/libre-franklin-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'Libre Franklin'; font-weight: 600; font-display: swap; src: url('fonts/libre-franklin-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family: 'Libre Franklin'; font-weight: 700; font-display: swap; src: url('fonts/libre-franklin-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 700; font-display: swap; src: url('fonts/atkinson-hyperlegible-latin-700-normal.woff2') format('woff2'); }

/* Layout: one screen. A fixed search bar on top, the music fills everything below it. */
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --surface: #ffffff;
  --fg: #14181f;
  --muted: #5b6472;
  --line: #d5d9e0;
  --accent: #610014;
  --accent-fg: #ffffff;
  --hit: #f6e6e8;
  --danger: #610014;
  --home-fg: #d9d9d9;
  --paper: #ffffff;
  --music-filter: none;
  --padw: 300px;
  --key-font: -apple-system, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  --font: "Libre Franklin", "Helvetica Neue", Arial, system-ui, sans-serif;
  --num-font: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
}

[hidden] { display: none !important; }
html, body { height: 100%; background: var(--accent); }
body { background: var(--accent); color: var(--fg); font-family: var(--font); font-size: 20px;
  margin: 0; overflow: hidden; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { position: fixed; inset: 0; display: flex; flex-direction: column; }
/* On the home screen iPadOS can make the page a little shorter than the screen, so size it to the full screen there. */
.standalone .app { bottom: auto; height: 100vh; height: 100lvh; }

/* Search bar */
.bar { display: flex; gap: 10px; align-items: center; padding: 10px 16px; position: relative; z-index: 4;
  background: rgba(206, 210, 217, .72); -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8);
  border-bottom: .5px solid rgba(0, 0, 0, .18); }
.search { flex: 1; min-width: 0; position: relative; display: flex; gap: 10px; }
.pad { position: absolute; left: 0; top: 100%; margin-top: 8px; z-index: 6; display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; width: var(--padw); box-sizing: border-box;
  padding: 8px; border-radius: 16px; background: rgba(206, 210, 217, .72); -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8);
  border: .5px solid rgba(255, 255, 255, .5); box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
  font-family: var(--key-font); -webkit-user-select: none; user-select: none; }
.pad button { height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  border: 0; border-radius: 8px; background: rgba(255, 255, 255, .88); color: #000; box-shadow: 0 1px 0 rgba(0, 0, 0, .3);
  font-family: inherit; font-weight: 400; font-size: 28px; line-height: 1; -webkit-tap-highlight-color: transparent; }
.pad button small { font-size: 9px; font-weight: 600; letter-spacing: .18em; margin-top: 2px; color: #000; }
.pad button:active { background: rgba(172, 177, 187, .9); }
.pad .fn { background: rgba(172, 177, 187, .55); font-size: 24px; }
.pad .fn:active { background: rgba(255, 255, 255, .88); }
.pad .go { background: var(--accent); color: #fff; font-size: 20px; font-weight: 500; }
.pad .go:active { background: #3d000c; }
.search.padopen .results { left: calc(var(--padw) + 10px); }
#qn { caret-color: transparent; }
.namebox { flex: 1; min-width: 0; position: relative; }
#q, #qn { width: 100%; box-sizing: border-box; font-family: var(--key-font); font-size: 28px; font-weight: 400; height: 60px;
  padding: 0 56px 0 18px; border: 0; border-radius: 8px; background: #fff; color: #000;
  box-shadow: 0 1px 0 rgba(0, 0, 0, .3); -webkit-appearance: none; appearance: none; }
#qn { flex: none; width: var(--padw); padding-right: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
#qn::placeholder { color: #4a4f58; font-weight: 700; }
#q::placeholder, #qn::placeholder { color: rgba(60, 60, 67, .55); }
#q:focus, #qn:focus { outline: none; box-shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 0 0 2px var(--accent); }
#clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent;
  font-family: var(--key-font); font-size: 28px; color: rgba(60, 60, 67, .55); }
.listbtn { flex: none; display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 18px; border: 0; border-radius: 8px;
  background: rgba(255, 255, 255, .88); color: #000; box-shadow: 0 1px 0 rgba(0, 0, 0, .3); font-family: var(--key-font); font-weight: 400; font-size: 22px; }
.listbtn:active { background: rgba(172, 177, 187, .9); }
.count { font-family: var(--key-font); font-weight: 600; min-width: 1.6em; padding: 2px 8px; border-radius: 999px; background: var(--accent);
  color: var(--accent-fg); font-variant-numeric: tabular-nums; text-align: center; }

/* Results dropdown */
.results { position: absolute; left: 0; right: 0; top: 100%; margin-top: 8px; z-index: 5;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  max-height: min(70vh, 640px); overflow-y: auto; box-shadow: 0 12px 32px rgba(0,0,0,.18); }
.row { display: flex; align-items: center; gap: 14px; padding: 6px 8px 6px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row.sel { background: var(--hit); }
.row .open { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 16px; text-align: left;
  border: 0; background: transparent; padding: 12px 0; font-size: 24px; }
.num { font-family: var(--num-font); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 2.4em; color: var(--accent); }
.name { min-width: 0; overflow-wrap: anywhere; }
.add { flex: none; height: 52px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--accent);
  background: transparent; color: var(--accent); font-weight: 700; font-size: 19px; white-space: nowrap; }
.add.on { background: var(--accent); color: var(--accent-fg); }
.empty { padding: 20px 18px; color: var(--muted); }

/* Tune view */
.main { flex: 1; min-height: 0; position: relative; }
.stage { position: absolute; inset: 0; display: block;
  background: transparent; overflow: auto; -webkit-overflow-scrolling: touch; }
.stack { display: flex; flex-direction: column; }
.tune { flex: none; background: var(--paper); border-top: 4px solid var(--accent); }
.tune:first-child { border-top: 0; }
.box { margin: 0 auto; }
.box img { display: block; width: 100%; height: 100%; max-width: none; filter: var(--music-filter); }
.tbar { height: 60px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 4px;
  background: var(--accent); color: var(--home-fg); }
.ttl { flex: 1; min-width: 0; font-size: 21px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttl b { font-family: var(--num-font); color: #fff; margin-right: 10px; font-variant-numeric: tabular-nums; }
.grip { flex: none; width: 52px; height: 52px; border: 0; background: transparent; color: var(--home-fg); font-size: 30px; touch-action: none; cursor: grab; }
.tb { flex: none; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: var(--home-fg); }
.tb:active { background: rgba(255,255,255,.15); }
.tb:disabled { opacity: .3; }
.tb.x svg { width: 34px; height: 34px; }
.tb.confirm { width: auto; padding: 0 14px; background: var(--home-fg); color: var(--accent); font-size: 18px; font-weight: 700; }
.reordering .box { display: none; }
.reordering .tune { border-top-width: 1px; }
.tune.dragging { position: relative; z-index: 3; box-shadow: 0 8px 28px rgba(0,0,0,.3); }
.divider { display: flex; align-items: baseline; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 18px; color: var(--muted); }
.divider b { font-family: var(--num-font); color: var(--accent); font-variant-numeric: tabular-nums; }
.home { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 28px; padding: 24px 16px 56px; background: var(--accent); color: var(--home-fg); text-align: center; }
.home-title { margin: 0; font-weight: 700; font-size: clamp(20px, 2.8vw, 30px); line-height: 1.25; letter-spacing: .04em; text-wrap: balance; }
.home .crest { width: auto; height: min(30vh, 260px); max-width: 60%; object-fit: contain; filter: invert(1) brightness(.85); }
.homemsg { max-width: 34em; color: var(--home-fg); font-size: 20px; line-height: 1.5; }
.homemsg:empty { display: none; }
.homemsg strong, .homemsg span { color: #fff !important; }
.homemsg .add.on { background: var(--home-fg); color: var(--accent); border-color: var(--home-fg); }
.part { position: absolute; right: 20px; bottom: 20px; line-height: 1; font-size: 16px; color: var(--home-fg); letter-spacing: .02em; }
.hint { margin: auto; padding: 24px 16px; max-width: 34em; text-align: center; color: var(--muted); font-size: 22px; line-height: 1.5; }
.hint strong { color: var(--fg); }

/* Song list sheet */
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.35); display: flex; justify-content: flex-end; }
.panel { width: min(520px, 100%); height: 100%; box-sizing: border-box; background: var(--surface);
  display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 12px); gap: 10px; }
.panel header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.panel h2 { margin: 0; font-size: 28px; }
.close { height: 52px; padding: 0 20px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-weight: 700; }
.items { flex: 1; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
.items li { display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--line); }
.help { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.4; }
.items .grip { color: var(--muted); }
.items li.dragging { position: relative; z-index: 2; background: var(--surface); box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.items li .open { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 14px; border: 0; background: transparent;
  text-align: left; padding: 16px 4px; font-size: 22px; }
.items li.cur { background: var(--hit); }
.mini { flex: none; width: 48px; height: 48px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; }
.mini.x { color: var(--danger); }
.mini:disabled { opacity: .3; }
.foot { display: flex; gap: 10px; flex-wrap: wrap; }
.foot button { height: 52px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-weight: 700; }
.foot .danger { color: var(--danger); }
.foot .confirm { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.loading { color: var(--home-fg); padding: 24px; font-size: 22px; margin: auto; }

@media (max-width: 600px) {
  body { font-size: 18px; }
  #q, #qn { font-size: 24px; }
  .search.padopen .results { left: 0; top: calc(100% + 300px); }
  .listbtn { height: 56px; padding: 0 12px; font-size: 18px; }
  .listbtn .lbl { display: none; }
  .row .open { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
.bar { padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-left: calc(16px + env(safe-area-inset-left, 0px)); padding-right: calc(16px + env(safe-area-inset-right, 0px)); }
.stage { padding-bottom: env(safe-area-inset-bottom, 0px); }
</style>

    <button id="listbtn" class="listbtn" type="button" aria-label="Tune list">

    </button>
  </div>
  <div class="main">

      <img class="crest" src="crest.png" alt="">

    <div id="stage" class="stage" hidden>
    <div id="stack" class="stack"></div>
    <input id="file" type="file" hidden>
    </div>
  </div>
</div>

<div id="sheet" class="sheet" hidden>

    <ul id="items" class="items"></ul>
    <div class="foot"><button id="clearlist" class="danger" type="button">Clear list</button></div>
  </div>
</div>

    return exact.concat(pre).slice(0, 30);
  }
  const words = s.split(' ');
  const scored = [];
  for (const t of idx) {
    if (!words.every(w => t.key.includes(w))) continue;
    let score = 0;
    if (t.key.startsWith(s)) score += 100;
    if ((' ' + t.key).includes(' ' + words[0])) score += 20;
    score -= t.key.length / 100;

function renderList() {
  const ul = $('items');
  if (!list.length) { ul.innerHTML = '<li><div class="empty">Your tune list is empty. Search for a tune and tap <b>+ Add</b>.</div></li>'; }
  else ul.innerHTML = list.map((n, i) =>
    '<li data-n="' + n + '" class="' + (n === cur ? 'cur' : '') + '"><button class="grip" type="button" aria-label="Drag to reorder">≡</button>' +
    '<button class="open" type="button" data-n="' + n + '"><span class="num">' + n + '</span><span class="name">' + esc(byNo.get(n)) + '</span></button>' +
    '<button class="mini x" type="button" data-rm="' + i + '" aria-label="Remove">✕</button></li>').join('');
  $('help').hidden = list.length < 2;
  const c = $('clearlist'); c.hidden = !list.length; c.textContent = 'Clear list'; c.classList.remove('confirm');
}
$('listbtn').addEventListener('click', () => { renderList(); $('sheet').hidden = false; });
$('closesheet').addEventListener('click', () => { $('sheet').hidden = true; });
$('sheet').addEventListener('click', e => {
  if (e.target === $('sheet')) { $('sheet').hidden = true; return; }
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.n) { $('sheet').hidden = true; openStack(+t.dataset.n); return; }
  if (t.dataset.rm) { list.splice(+t.dataset.rm, 1); }
  else if (t.id === 'clearlist') {
    if (!t.classList.contains('confirm')) { t.classList.add('confirm'); t.textContent = 'Tap again to clear all'; return; }
    list = [];
  } else return;
  saveList(); renderList(); refresh();
});

/* ---------- keep the screen awake during a concert ---------- */
let lock = null;
async function wake() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible') lock = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', wake);
document.addEventListener('pointerdown', () => { if (!lock) wake(); }, { once: true });

/* ---------- start: use the tune book saved on this iPad, or ask for the PDF once ---------- */
const hint = $('homemsg');
const FILENAME = 'Band Tune Book - 2nd Cornet.pdf';
function askForFile(msg) {
  goHome(false);
  hint.innerHTML = '<strong>Load your tune book</strong><br>Choose the file <strong>' + FILENAME + '</strong> from Files. ' +
    'You only need to do this once. The music then stays on this iPad and works without internet.' +
    (msg ? '<br><br><span style="color:var(--danger)">' + esc(msg) + '</span>' : '') +
    '<br><br><button id="pick" class="add on" type="button" style="height:64px;font-size:22px;padding:0 28px">Choose tune book file</button>';
  $('pick').onclick = () => $('file').click();
}
$('file').addEventListener('change', async () => {
  const f = $('file').files[0]; if (!f) return;
  hint.innerHTML = 'Loading the tune book…';
  try {
    const buf = await f.arrayBuffer();
    await openBook(buf);
    const ok = await idbPut('book', buf);
    $('file').value = '';
    hint.innerHTML = ok ? '' : 'This browser would not save the tune book, so you may need to load it again next time.';
    $('sheet').hidden = true;
  } catch (e) {
    askForFile('That file is not the tune book. Choose “' + FILENAME + '”.');
  }
});
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
(async () => {
  let buf = null;
  try { buf = await idbGet('book'); } catch (e) {}
  if (!buf) { askForFile(''); return; }
  try { await openBook(buf); } catch (e) { askForFile(''); return; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  try { const last = JSON.parse(localStorage.getItem('last') || 'null'); if (last && inList(last[0])) openStack(last[0]); } catch (e) {}
})();
</script>
